name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri
        run: npm run tauri:build

      - name: Upload Tauri bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-dmg-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7

      - name: Upload Tauri Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer-win
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

      - name: Upload Tauri Linux archive
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-archive-linux
          path: src-tauri/target/release/bundle/*.AppImage
          retention-days: 7